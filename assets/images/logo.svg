<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50" fill="none">
  <defs>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- SmartHub Icon -->
  <g transform="translate(6, 5)">
    <!-- Outer rounded hexagon / shield background -->
    <rect x="0" y="0" width="40" height="40" rx="12" fill="url(#hubGrad)" />
    <!-- Connecting network lines -->
    <path d="M20 10 L11 18 L14 29 L26 29 L29 18 Z" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" fill="none" />
    <line x1="20" y1="20" x2="20" y2="10" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="20" x2="11" y2="18" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="20" x2="14" y2="29" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="20" x2="26" y2="29" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="20" x2="29" y2="18" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <!-- Outer satellite nodes -->
    <circle cx="20" cy="10" r="2.5" fill="#ffffff" />
    <circle cx="11" cy="18" r="2.5" fill="#38bdf8" />
    <circle cx="14" cy="29" r="2.5" fill="#ffffff" />
    <circle cx="26" cy="29" r="2.5" fill="#ffffff" />
    <circle cx="29" cy="18" r="2.5" fill="#38bdf8" />
    <!-- Center Smart Core Hub -->
    <circle cx="20" cy="20" r="4.5" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="20" cy="20" r="2.2" fill="#4f46e5"/>
  </g>

  <!-- Typography -->
  <g transform="translate(56, 33)">
    <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#0f172a" class="brand-text-primary">Smart</tspan><tspan fill="url(#hubGrad)">Hub</tspan>
    </text>
  </g>
  <!-- Mini badge dot -->
  <circle cx="168" cy="18" r="3" fill="#10b981" />
</svg>
